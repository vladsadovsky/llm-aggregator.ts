appId: com.llm-aggregator.app
productName: LLM Aggregator
directories:
  buildResources: build
  output: dist
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
mac:
  icon: public/icons/llm-aggregator.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-mac.${ext}"
win:
  icon: public/icons/llm-aggregator.ico
  target:
    - nsis
    - portable
    - msi
  # ${target} is required here: nsis and portable both emit .exe, so without it
  # they render identical filenames and one silently overwrites the other.
  artifactName: "${productName}-${version}-win-${target}.${ext}"
linux:
  icon: public/icons/llm-aggregator.png
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: "${productName}-${version}-linux.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
msi:
  oneClick: false
  perMachine: false
  upgradeCode: "70DA883D-10E1-456D-BFBB-6E77AAE20DFC"
