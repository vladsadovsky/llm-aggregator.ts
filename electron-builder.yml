appId: com.llm-aggregator.app
productName: LLM Aggregator
directories:
  buildResources: build
  output: dist
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
  # Turndown's HTML converter resolves @mixmark-io/domino at runtime from the
  # main-process bundle, so the portable package must carry that production
  # dependency even though the rest of node_modules stays excluded.
  - node_modules/@mixmark-io/domino/**/*
mac:
  icon: public/icons/llm-aggregator.icns
  category: public.app-category.productivity
  # V2 support policy: macOS 12+ on Apple Silicon. Intel artifacts are not shipped.
  minimumSystemVersion: "12.0"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: "${productName}-${version}-mac.${ext}"
win:
  icon: public/icons/llm-aggregator.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: msi
      arch:
        - x64
  # nsis and portable both emit .exe, so each target sets its own artifactName
  # below to avoid identical filenames overwriting each other. (Do NOT use a
  # win-level "${target}" macro — it is not a valid electron-builder macro and
  # fails the whole win build with "macro target is not defined".)
linux:
  icon: public/icons/llm-aggregator.png
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: "${productName}-${version}-linux.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-win-setup.${ext}"
portable:
  artifactName: "${productName}-${version}-win-portable.${ext}"
msi:
  oneClick: false
  perMachine: false
  upgradeCode: "70DA883D-10E1-456D-BFBB-6E77AAE20DFC"
  artifactName: "${productName}-${version}-win-msi.${ext}"
